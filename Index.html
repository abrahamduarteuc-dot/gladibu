/* ---------- Tokens (modo claro por defecto) ---------- */
:root {
  --bg: #f1f4f6;
  --surface: #ffffff;
  --ink: #14202e;
  --soft: #5d6b7a;
  --line: #e1e7ec;
  --primary: #0b6e8a;
  --on-primary: #ffffff;
  --deep: #0e3a4b;
  --tint: #e1f1f5;
  --gold: #8a6200;
  --gold-line: #d9a521;
  --gold-bg: #fbf1d4;
  --green: #1d6a40;
  --green-line: #3aa36c;
  --green-bg: #e3f3e9;
  --red: #a8372f;
  --red-line: #d9776f;
  --red-bg: #fbe5e2;
  --hero-soft: #b9d7e0;
  --tile-fg: #ffffff;
  --focus: #0b6e8a;
  --shadow: 0 1px 2px rgba(20, 32, 46, .06), 0 10px 28px -16px rgba(20, 32, 46, .22);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --radius: 18px;
  --topbar-h: 60px;
  --sidebar-w: 264px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1620;
    --surface: #142230;
    --ink: #e7eef4;
    --soft: #9db0c0;
    --line: #243649;
    --primary: #4db8d6;
    --on-primary: #06222c;
    --deep: #0b2d3b;
    --tint: #123846;
    --gold: #e3b84a;
    --gold-line: #c99a2c;
    --gold-bg: #3a2f10;
    --green: #62c48f;
    --green-line: #3d9a6b;
    --green-bg: #123525;
    --red: #f08a82;
    --red-line: #c9625b;
    --red-bg: #3d1b19;
    --hero-soft: #9fc6d3;
    --tile-fg: #0b1118;
    --focus: #4db8d6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -16px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0c1620;
  --surface: #142230;
  --ink: #e7eef4;
  --soft: #9db0c0;
  --line: #243649;
  --primary: #4db8d6;
  --on-primary: #06222c;
  --deep: #0b2d3b;
  --tint: #123846;
  --gold: #e3b84a;
  --gold-line: #c99a2c;
  --gold-bg: #3a2f10;
  --green: #62c48f;
  --green-line: #3d9a6b;
  --green-bg: #123525;
  --red: #f08a82;
  --red-line: #c9625b;
  --red-bg: #3d1b19;
  --hero-soft: #9fc6d3;
  --tile-fg: #0b1118;
  --focus: #4db8d6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -16px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  caret-color: var(--primary);
  scrollbar-color: var(--line) transparent;
}
::selection { background: var(--tint); color: var(--ink); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.015em; line-height: 1.15; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--primary); text-underline-offset: 3px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 14px;
  font-weight: 700; font-size: 15px; white-space: nowrap;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  transition: transform 140ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, opacity 160ms ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.deep { background: var(--deep); border-color: var(--deep); color: #fff; }
.btn.danger { color: var(--red); border-color: var(--red-line); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--primary); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 14px; color: var(--ink);
  transition: transform 140ms var(--ease-out), background-color 160ms ease;
}
.icon-btn:active { transform: scale(0.95); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { border-color: var(--primary); }
  .btn.primary:hover { background: var(--deep); border-color: var(--deep); color: #fff; }
  .icon-btn:hover { background: var(--tint); }
}

/* ---------- Cinta DEMO y barra superior ---------- */
.ribbon {
  background: var(--ink); color: var(--bg); text-align: center;
  font-size: 13px; font-weight: 600; letter-spacing: .02em; padding: 7px 16px;
}
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; text-decoration: none; color: var(--ink); }
.brand svg { width: 34px; height: 34px; }
.brand b { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
.brand span { font-size: 14px; font-weight: 600; color: var(--soft); }
@media (max-width: 420px) { .brand span { display: none; } }

/* ---------- Estructura: menú lateral + contenido ---------- */
.shell { display: block; }
.sidebar {
  position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: min(86vw, 300px);
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-102%); transition: transform 320ms var(--ease-drawer);
  overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
}
.sidebar.open { transform: none; }
.scrim {
  position: fixed; inset: 0; z-index: 40; background: rgba(8, 20, 28, .5);
  opacity: 0; pointer-events: none; transition: opacity 240ms ease;
}
.scrim.show { opacity: 1; pointer-events: auto; }
.nav-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 14px;
  border-radius: 14px; font-weight: 600; text-align: left; color: var(--ink);
  transition: background-color 160ms ease, transform 140ms var(--ease-out);
}
.nav-item:active { transform: scale(0.98); }
.nav-item .count { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--soft); }
.nav-item[aria-current="page"] { background: var(--tint); color: var(--primary); }
.nav-item[aria-current="page"] .count { color: var(--primary); }
.nav-sep { height: 1px; background: var(--line); margin: 8px 6px; }
@media (hover: hover) and (pointer: fine) { .nav-item:hover { background: var(--tint); } }

.main { padding: 16px 16px 48px; min-width: 0; }
.page { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
.page.wide { max-width: none; }

@media (min-width: 1100px) {
  .shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .sidebar {
    position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); width: auto;
    transform: none; transition: none; background: transparent; border-right: 1px solid var(--line);
  }
  .nav-head { display: none; }
  .scrim { display: none; }
  body.nav-collapsed .shell { grid-template-columns: 0 minmax(0, 1fr); }
  body.nav-collapsed .sidebar { display: none; }
  .main { padding: 28px 32px 64px; }
}

/* ---------- Tarjetas ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.card h2 { font-size: 19px; font-weight: 800; }
.card .sub { color: var(--soft); font-size: 14px; margin-top: 4px; }

/* ---------- Inicio: banner ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 28px; background: var(--deep); color: #fff;
  padding: 24px 20px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px;
}
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .06); pointer-events: none; }
.hero::before { width: 280px; height: 280px; right: -90px; top: -120px; }
.hero::after { width: 180px; height: 180px; right: 90px; bottom: -110px; background: rgba(255, 255, 255, .04); }
.hero > * { position: relative; z-index: 1; }
.hero .total { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hero .total b { font-size: clamp(52px, 12vw, 76px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.hero .total span { font-size: 17px; font-weight: 600; color: var(--hero-soft); }
.bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, .12); gap: 3px; }
.bar i { display: block; min-width: 6px; transition: flex-grow 400ms var(--ease-out); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; font-size: 14px; color: var(--hero-soft); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ask { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.ask label { font-weight: 700; font-size: 15px; }
.ask-row { display: flex; gap: 8px; background: #fff; border-radius: 16px; padding: 6px; }
.ask-row input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 12px; min-height: 46px; color: #14202e; font-size: 16px; }
.ask-row input::placeholder { color: #5d6b7a; }
.ask-row input:focus-visible { outline: none; }
.ask-row:focus-within { outline: 3px solid #8fd3e6; outline-offset: 2px; }
.ask-row .btn { min-height: 46px; border-radius: 12px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest button {
  min-height: 40px; padding: 0 14px; border-radius: 99px; font-size: 14px; font-weight: 600; color: #fff; text-align: left;
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22);
  transition: background-color 160ms ease, transform 140ms var(--ease-out);
}
.suggest button:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .suggest button:hover { background: rgba(255, 255, 255, .2); } }
@media (min-width: 720px) { .hero { padding: 32px 32px 28px; } }

/* ---------- Inicio: tarjetas que filtran ---------- */
.kgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 720px) { .kgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
.kcard {
  --c: var(--primary); text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-top: 5px solid var(--c); border-radius: var(--radius); padding: 14px 16px 16px; min-height: 112px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 8px; box-shadow: var(--shadow);
  transition: transform 160ms var(--ease-out), border-color 160ms ease;
}
.kcard:active { transform: scale(0.98); }
.kcard b { font-size: 44px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.kcard span { font-size: 15px; font-weight: 700; }
.kcard small { display: block; font-size: 13px; color: var(--soft); font-weight: 500; margin-top: 2px; }
@media (hover: hover) and (pointer: fine) { .kcard:hover { border-color: var(--c); transform: translateY(-2px); } }

/* ---------- Filtros rápidos (chips) ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; min-height: 44px; border: 1.5px solid var(--line); border-radius: 99px;
  background: var(--surface); overflow: hidden; transition: border-color 160ms ease;
}
.chip.on { border-color: var(--primary); background: var(--tint); }
.chip button.l { min-height: 44px; padding: 0 6px 0 16px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.chip button.l em { font-style: normal; font-weight: 600; color: var(--primary); }
.chip button.x { width: 38px; min-height: 44px; display: grid; place-items: center; color: var(--soft); }
.chip button.x svg { width: 16px; height: 16px; }
.chip.add { border-style: dashed; color: var(--primary); }
.chip.add button.l { padding: 0 16px 0 12px; color: var(--primary); }
@media (hover: hover) and (pointer: fine) { .chip:hover { border-color: var(--primary); } .chip button.x:hover { color: var(--red); } }

/* ---------- Semáforo y etiquetas ---------- */
.sem { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 99px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.sem::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.sem.g { background: var(--green-bg); color: var(--green); }
.sem.y { background: var(--gold-bg); color: var(--gold); }
.sem.r { background: var(--red-bg); color: var(--red); }
.sem.n { background: var(--line); color: var(--soft); }
.tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 700; background: var(--line); color: var(--soft); }
.tag.rev { background: var(--tint); color: var(--primary); }
.tag.con { background: var(--gold-bg); color: var(--gold); }
.tag.gua { background: var(--green-bg); color: var(--green); }
.tag.vet { background: var(--red-bg); color: var(--red); }
.tag.dat { background: var(--line); color: var(--ink); }

/* ---------- Resultados ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar h1 { font-size: 26px; font-weight: 800; }
.toolbar .count { color: var(--soft); font-weight: 600; }
.active-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.atag { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 4px 0 12px; border-radius: 99px; background: var(--tint); color: var(--primary); font-size: 14px; font-weight: 700; }
.atag button { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
.atag svg { width: 15px; height: 15px; }
.assistant-note { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--tint); color: var(--ink); font-weight: 600; }
.assistant-note svg { color: var(--primary); margin-top: 2px; }
.list { display: grid; gap: 10px; }
.row {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 12px 14px; min-height: 76px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  transition: transform 160ms var(--ease-out), border-color 160ms ease, background-color 160ms ease;
}
.row:active { transform: scale(0.99); }
.row[aria-current="true"] { border-color: var(--primary); background: var(--tint); }
.avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--primary); font-weight: 800; font-size: 16px; letter-spacing: .02em; }
.row .nm { font-weight: 700; font-size: 16px; line-height: 1.25; }
.row .rl { color: var(--soft); font-size: 14px; }
.row .meta { color: var(--soft); font-size: 13.5px; margin-top: 1px; }
.row .end { display: grid; gap: 6px; justify-items: end; }
@media (max-width: 480px) { .row { grid-template-columns: 44px minmax(0, 1fr); } .row .end { grid-column: 2; display: flex; justify-content: flex-start; flex-wrap: wrap; gap: 6px; } .avatar { width: 44px; height: 44px; } }
@media (hover: hover) and (pointer: fine) { .row:hover { border-color: var(--primary); } }
.empty { text-align: center; padding: 40px 20px; color: var(--soft); }
.empty b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 6px; }

/* ---------- Ficha + currículo ---------- */
.detail { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.detail .listpane { display: none; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 14px; }
.tabs button { min-height: 44px; border-radius: 11px; font-weight: 700; color: var(--soft); transition: background-color 160ms ease, color 160ms ease; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.detail[data-tab="ficha"] .cvpane { display: none; }
.detail[data-tab="cv"] .fichapane { display: none; }
.fichapane { display: grid; gap: 16px; align-content: start; min-width: 0; }
.cvpane { min-width: 0; }
.head { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.head .avatar { width: 64px; height: 64px; font-size: 22px; }
.head h1 { font-size: 24px; font-weight: 800; }
.head p { color: var(--soft); }
.contact { display: grid; gap: 4px; margin-top: 14px; }
.crow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 48px; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; }
.crow svg { color: var(--soft); }
.crow span { overflow-wrap: anywhere; font-weight: 600; font-size: 15px; }
.crow .miss { color: var(--red); font-weight: 700; }
.copy { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--primary); }
.copy[data-done="1"] { color: var(--green); }
.crits { display: grid; gap: 0; margin-top: 12px; }
.crit { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.crit:first-child { border-top: 0; }
.crit b { display: block; font-size: 15px; }
.crit p { color: var(--soft); font-size: 14px; }
.note { font-size: 14px; font-weight: 600; color: var(--soft); background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.timeline { display: grid; gap: 0; margin-top: 12px; }
.job { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 14px; padding-bottom: 16px; position: relative; }
.job::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.job:last-child { padding-bottom: 0; }
.job:last-child::before { display: none; }
.job i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--primary); background: var(--surface); margin-top: 4px; }
.job b { display: block; font-size: 15px; }
.job span { display: block; color: var(--soft); font-size: 14px; }
.actions .btn { padding: 0 10px; line-height: 1.2; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.alert { display: grid; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--gold-bg); color: var(--ink); border: 1px solid var(--gold-line); }
.alert b { color: var(--gold); }
.veto-box { padding: 14px 16px; border-radius: 16px; background: var(--red-bg); color: var(--ink); border: 1px solid var(--red-line); }
.veto-box b { color: var(--red); }
.confirm { display: grid; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--red-bg); border: 1px solid var(--red-line); grid-column: 1 / -1; }
.confirm .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.paper {
  background: #ffffff; color: #1a2430; border-radius: 6px; padding: 28px 24px 32px; font-size: 13.5px; line-height: 1.55;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 18px 40px -20px rgba(0, 0, 0, .35); min-height: 560px;
}
.paper h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.paper .role { color: #3b4a5a; font-weight: 600; font-size: 15px; margin-top: 2px; }
.paper .ct { color: #3b4a5a; font-size: 12.5px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.paper h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #0b6e8a; border-bottom: 1px solid #d8e0e6; padding-bottom: 4px; margin: 20px 0 8px; }
.paper .it { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
.paper .it span { font-weight: 500; color: #3b4a5a; white-space: nowrap; }
.paper p.d { color: #3b4a5a; margin-bottom: 8px; }
.paper ul { margin: 0; padding-left: 18px; }
@media (min-width: 720px) { .paper { padding: 44px 48px 48px; font-size: 14px; } }

@media (min-width: 1100px) {
  .detail { grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .tabs { display: none; }
  .detail[data-tab="ficha"] .cvpane, .detail[data-tab="cv"] .fichapane { display: grid; }
  .cvpane { position: sticky; top: calc(var(--topbar-h) + 20px); max-height: calc(100vh - var(--topbar-h) - 40px); overflow-y: auto; border-radius: 6px; }
}
@media (min-width: 1560px) {
  .detail { grid-template-columns: 320px minmax(340px, 420px) minmax(0, 1fr); }
  .detail .listpane { display: block; position: sticky; top: calc(var(--topbar-h) + 20px); max-height: calc(100vh - var(--topbar-h) - 40px); overflow-y: auto; }
  .listpane .list { gap: 8px; }
  .listpane .row { grid-template-columns: 40px minmax(0, 1fr); padding: 10px 12px; min-height: 64px; }
  .listpane .row .end { display: none; }
  .listpane .avatar { width: 40px; height: 40px; font-size: 14px; }
}

/* ---------- Cargar currículos ---------- */
.drop {
  display: grid; justify-items: center; gap: 10px; text-align: center; padding: 36px 20px;
  border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface); transition: border-color 160ms ease, background-color 160ms ease;
}
.drop.over { border-color: var(--primary); background: var(--tint); }
.drop svg { width: 36px; height: 36px; color: var(--primary); }
.drop b { font-size: 18px; }
.drop p { color: var(--soft); font-size: 14px; }
.files { display: grid; gap: 10px; }
.file { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.file .top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 14px; }
.file .top span:first-child { overflow-wrap: anywhere; }
.prog { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--primary); transition: width 220ms linear; }
.file[data-done="1"] .prog i { background: var(--green-line); }
textarea.field, input.field, select.field {
  width: 100%; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px; min-height: 48px; font-size: 16px;
}
textarea.field { min-height: 120px; resize: vertical; line-height: 1.5; }
.field:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

/* ---------- Configuración ---------- */
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.acc + .acc { margin-top: 12px; }
.acc summary { list-style: none; min-height: 60px; padding: 0 20px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 17px; cursor: pointer; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .chev { margin-left: auto; transition: transform 200ms var(--ease-out); color: var(--soft); }
.acc[open] summary .chev { transform: rotate(180deg); }
.acc .body { padding: 4px 20px 20px; display: grid; gap: 14px; }
.lab { display: grid; gap: 6px; font-weight: 700; font-size: 14px; }
.lab small { font-weight: 500; color: var(--soft); font-size: 13.5px; }
.sw { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; min-height: 52px; }
.sw b { display: block; font-size: 15px; }
.sw small { color: var(--soft); font-size: 13.5px; }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw .track { width: 52px; height: 32px; border-radius: 99px; background: var(--line); position: relative; transition: background-color 180ms ease; flex: none; }
.sw .track::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform 200ms var(--ease-out); }
.sw input:checked + .track { background: var(--primary); }
.sw input:checked + .track::after { transform: translateX(20px); }
.sw input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
.sw.locked { opacity: .65; }
.sw.locked .track { background: var(--line); }
.lock { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--soft); }

/* ---------- Hojas (modales) y avisos ---------- */
.overlay { position: fixed; inset: 0; z-index: 70; background: rgba(8, 20, 28, .55); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 220ms ease; }
.overlay.show { opacity: 1; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px;
  transform: translateY(100%); transition: transform 320ms var(--ease-drawer);
}
.overlay.show .sheet { transform: none; }
.sheet h2 { font-size: 21px; font-weight: 800; }
.sheet .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.sheet .btns .btn { flex: 1 1 140px; }
.opts { display: flex; flex-wrap: wrap; gap: 10px; max-height: 40vh; overflow-y: auto; padding: 2px; }
.opt { min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; transition: transform 140ms var(--ease-out), border-color 160ms ease, background-color 160ms ease; }
.opts.list { flex-direction: column; flex-wrap: nowrap; gap: 8px; }
.opts.list .opt { width: 100%; justify-content: flex-start; text-align: left; padding: 10px 16px; line-height: 1.3; }
.opt:active { transform: scale(0.97); }
.opt[aria-pressed="true"] { border-color: var(--primary); background: var(--tint); color: var(--primary); }
.opt small { color: var(--soft); font-weight: 600; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 14px; }
.seg button { min-height: 44px; border-radius: 11px; font-weight: 700; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
@media (min-width: 720px) {
  .overlay { align-items: center; padding: 24px; }
  .sheet { border-radius: 24px; transform: scale(0.96); opacity: 0; transition: transform 220ms var(--ease-out), opacity 220ms ease; }
  .overlay.show .sheet { transform: none; opacity: 1; }
}
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 90; max-width: min(92vw, 460px);
  transform: translate(-50%, 24px); opacity: 0; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 15px;
  box-shadow: 0 12px 32px -12px rgba(0, 0, 0, .5); transition: transform 280ms var(--ease-out), opacity 220ms ease; pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

/* ---------- Movimiento: una sola entrada orquestada en Inicio ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.enter .kcard, .enter .hero, .enter .card { animation: rise 420ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
}

[tabindex="-1"]:focus { outline: none; }


/* ==========================================================================
   v2 · estructura nueva: barra inferior, asistente + filtros, estados en fila,
   currículos en lista o tarjetas, canales de contacto directos
   ========================================================================== */
.tabbar {
  position: fixed; z-index: 35; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; padding: 6px; max-width: 520px; margin: 0 auto;
  background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line); border-radius: 28px;
  box-shadow: 0 12px 30px -12px rgba(14, 58, 75, .38); backdrop-filter: blur(14px);
}
.tab-item {
  flex: 1; min-width: 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border-radius: 22px; font-size: 12px; font-weight: 700; color: var(--soft);
  transition: background-color 200ms var(--ease-out), color 200ms var(--ease-out), transform 140ms var(--ease-out);
}
.tab-item svg { width: 22px; height: 22px; }
.tab-item:active { transform: scale(0.95); }
.tab-item[aria-current="page"] { background: var(--tint); color: var(--primary); }
@media (hover: hover) and (pointer: fine) { .tab-item:not([aria-current="page"]):hover { color: var(--ink); background: color-mix(in srgb, var(--tint) 55%, transparent); } }
.main { padding-bottom: 120px; }
.toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 1100px) {
  .tabbar {
    position: sticky; top: var(--topbar-h); left: auto; right: auto; bottom: auto; max-width: none; margin: 0;
    height: calc(100vh - var(--topbar-h)); flex-direction: column; justify-content: flex-start; gap: 4px; padding: 16px 12px;
    border: 0; border-right: 1px solid var(--line); border-radius: 0; box-shadow: none; background: transparent; backdrop-filter: none;
  }
  .tab-item { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 48px; padding: 0 14px; font-size: 15px; border-radius: 14px; }
  .tab-item svg { width: 20px; height: 20px; }
  .main { padding-bottom: 64px; }
  .toast { bottom: 24px; }
}

/* Inicio: asistente con los filtros rápidos adentro */
.qf { display: grid; gap: 4px; }
.qf > b { font-size: 15px; font-weight: 700; }
.hero .qf .chips { margin-top: 8px; }
.hero .chip { border-color: transparent; }
.hero .chip.add { border: 1.5px dashed var(--hero-soft); background: transparent; }
.hero .chip.add button.l { color: #fff; }
.hero .chip button.l, .hero .chip button.x { color: var(--ink); }
.hero .chip.on { background: var(--tint); }
.hero .chip button.l em { color: var(--primary); }

/* Estados como fila de íconos */
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.sec-h h2 { font-size: 20px; font-weight: 800; }
.sec-h > button:not(.vt) { color: var(--primary); font-weight: 700; font-size: 15px; min-height: 44px; padding: 0 2px; }
.tiles { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; margin: 0 -16px; padding: 10px 16px 6px; scrollbar-width: none; }
.tiles::-webkit-scrollbar { display: none; }
.tile { flex: none; width: 82px; display: grid; justify-items: center; gap: 10px; text-align: center; font-size: 13.5px; font-weight: 700; line-height: 1.2; scroll-snap-align: start; }
.tile .ico { position: relative; width: 70px; height: 70px; border-radius: 22px; background: var(--c); color: var(--tile-fg); display: grid; place-items: center; transition: transform 160ms var(--ease-out); }
.tile .ico svg { width: 30px; height: 30px; }
.tile .n { position: absolute; top: -8px; right: -8px; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 99px; background: var(--surface); color: var(--ink); border: 2px solid var(--bg); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); font-size: 14px; font-weight: 800; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tile:active .ico { transform: scale(0.95); }
@media (hover: hover) and (pointer: fine) { .tile:hover .ico { transform: translateY(-2px); } }
@media (min-width: 720px) { .tiles { margin: 0; padding-inline: 0; gap: 20px; } .tile { width: 92px; } .tile .ico { width: 76px; height: 76px; } }

/* Alternar lista / tarjetas */
.vtoggle { display: inline-flex; background: var(--line); border-radius: 14px; padding: 3px; }
.vtoggle button { min-height: 38px; padding: 0 12px; border-radius: 11px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: var(--soft); transition: background-color 160ms ease, color 160ms ease; }
.vtoggle button svg { width: 18px; height: 18px; }
.vtoggle button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.toolbar .sp { flex: 1; }
.toolbar h1 { flex: none; }

/* Currículos: lista */
.flist { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-top: 1px solid var(--line); transition: background-color 160ms ease; }
.frow:first-child { border-top: 0; }
.frow[aria-current="true"] { background: var(--tint); }
.rmain { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 2px 12px 14px; text-align: left; min-width: 0; width: 100%; transition: transform 140ms var(--ease-out); }
.rmain:active { transform: scale(0.99); }
.rmain .txt { display: grid; gap: 1px; min-width: 0; }
.rmain .nm { font-weight: 700; font-size: 16px; line-height: 1.25; }
.rmain .rl { color: var(--soft); font-size: 14px; }
.rmain .meta { color: var(--soft); font-size: 13.5px; }
.rmain .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.frow .more { width: 44px; height: 44px; margin-right: 6px; border-radius: 14px; display: grid; place-items: center; color: var(--soft); transition: background-color 160ms ease, transform 140ms var(--ease-out); }
.frow .more:active { transform: scale(0.92); }
@media (hover: hover) and (pointer: fine) { .frow:hover { background: color-mix(in srgb, var(--tint) 55%, transparent); } .frow .more:hover { background: var(--tint); color: var(--primary); } }
.more-all { width: 100%; margin-top: 14px; justify-content: space-between; }

/* Currículos: tarjetas */
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 720px) { .cgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 1100px) { .cgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.frow.ccard { position: relative; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.frow.ccard:first-child { border-top: 1px solid var(--line); }
.ccard .rmain { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: start; gap: 10px; padding: 16px 14px 14px; }
.ccard .avatar { width: 52px; height: 52px; }
.ccard .more { position: absolute; top: 6px; right: 2px; margin: 0; }
.ccard .nm { font-size: 15.5px; }

/* Ficha: canales de contacto directos */
.ch { font-size: 17px; font-weight: 800; margin-top: 16px; }
.chans { display: grid; gap: 10px; margin-top: 10px; }
.chan { --cc: var(--primary); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-radius: 18px; background: color-mix(in srgb, var(--cc) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--cc) 22%, var(--line)); }
.chan.wa { --cc: #1f9d55; } .chan.ma { --cc: #0b6e8a; } .chan.li { --cc: #0a66c2; }
.cmain { display: grid; grid-template-columns: 44px minmax(0, 1fr) 20px; gap: 12px; align-items: center; padding: 10px 12px; text-align: left; min-width: 0; transition: transform 140ms var(--ease-out); border-radius: 18px; }
.cmain:active:not([disabled]) { transform: scale(0.99); }
.cmain[disabled] { cursor: default; }
.cico { width: 44px; height: 44px; border-radius: 13px; background: var(--cc); color: #fff; display: grid; place-items: center; }
.ctx { display: grid; min-width: 0; }
.ctx small { color: var(--soft); font-size: 13px; font-weight: 600; }
.ctx b { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.chan .miss, .ctx .miss { color: var(--red); font-weight: 700; }
.cmain > svg:last-child { color: var(--soft); width: 18px; height: 18px; }
.chan.off { background: var(--surface); border-color: var(--line); }
.chan.off .cico { background: var(--line); color: var(--soft); }
.chan .copy { width: 44px; height: 44px; margin-right: 4px; display: grid; place-items: center; color: var(--soft); border-radius: 12px; }
@media (hover: hover) and (pointer: fine) { .chan .copy:hover { color: var(--primary); } .cmain:hover:not([disabled]) .cico { transform: scale(1.04); } }
.actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.actions .btn { padding: 0 6px; font-size: 14px; gap: 6px; }
.actions .confirm { grid-column: 1 / -1; }

/* Menú ⋯ de cada currículo */
.mhead { display: flex; align-items: center; gap: 14px; }
.mhead h2 { font-size: 19px; }
.mlist { display: grid; }
.mrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 18px; gap: 12px; align-items: center; min-height: 56px; padding: 6px 4px; text-align: left; border-top: 1px solid var(--line); transition: background-color 160ms ease; }
.mrow:first-child { border-top: 0; }
.mrow[disabled] { opacity: .5; cursor: default; }
.mrow > svg:last-child { color: var(--soft); width: 18px; height: 18px; }
.mico { width: 40px; height: 40px; border-radius: 12px; background: var(--tint); color: var(--primary); display: grid; place-items: center; }
.mrow b { font-size: 15.5px; font-weight: 700; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 1100px) { .listpane .frow .more, .listpane .rmain .tags { display: none; } .listpane .rmain { grid-template-columns: 40px minmax(0, 1fr); } .listpane .avatar { width: 40px; height: 40px; font-size: 14px; } .listpane .rmain .meta { display: none; } }
.page { grid-template-columns: minmax(0, 1fr); }
.page > * { min-width: 0; }

/* Filtros rápidos v2b: cuadrícula ordenada (2 columnas en celular, 3 en pantallas anchas) */
.qf-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.qf-h .addf { min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1.5px dashed var(--hero-soft); color: #fff; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: background-color 160ms ease, transform 140ms var(--ease-out); }
.qf-h .addf:active { transform: scale(0.97); }
.qf-h .addf svg { width: 16px; height: 16px; }
@media (hover: hover) and (pointer: fine) { .qf-h .addf:hover { background: rgba(255, 255, 255, .12); } }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
@media (min-width: 720px) { .fgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; } }
.fcell { position: relative; background: var(--surface); color: var(--ink); border: 1.5px solid transparent; border-radius: 16px; transition: border-color 160ms ease, background-color 160ms ease; }
.fcell.on { background: var(--tint); border-color: var(--primary); }
.fcell .fb { display: grid; gap: 2px; width: 100%; min-height: 62px; padding: 10px 40px 10px 14px; text-align: left; align-content: center; border-radius: 16px; transition: transform 140ms var(--ease-out); }
.fcell .fb:active { transform: scale(0.98); }
.fcell .fl { font-size: 12.5px; font-weight: 600; color: var(--soft); line-height: 1.2; }
.fcell .fv { font-size: 15px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fcell:not(.on) .fv { color: var(--soft); font-weight: 600; }
.fcell.on .fv { color: var(--primary); }
.fcell .fx { position: absolute; top: 4px; right: 4px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; color: var(--soft); }
.fcell .fx svg { width: 15px; height: 15px; }
@media (hover: hover) and (pointer: fine) { .fcell:hover { border-color: var(--primary); } .fcell .fx:hover { color: var(--red); } }
.modehint { font-size: 13.5px; color: var(--soft); margin-top: -4px; }
.note-cost b { font-weight: 800; }
.file .tk { font-size: 13px; color: var(--soft); font-weight: 600; }
.tiles { scroll-padding-inline: 16px; }
.cmain { grid-template-columns: 44px minmax(0, 1fr); }
.ctx b { overflow-wrap: break-word; font-size: 15.5px; }

</style>
</head>

      return (db - da) || (ORD[y.o] - ORD[x.o]) || (y.score - x.score) || (y.anios - x.anios);
    });
  }

  function cloneF(f) { return { estado: f.estado, falta: f.falta, q: JSON.parse(JSON.stringify(f.q)), m: JSON.parse(JSON.stringify(f.m || {})), ask: f.ask }; }

  /* ---------- Asistente (lógica simulada en JavaScript) ----------
     CONECTAR A CLAUDE: aquí se enviaría la pregunta a la API y se recibiría
     la lista de ids. En la demo se detecta ciudad, profesión y "falta/pendiente". */
  var CIUDADES = ["la serena", "santiago", "valparaiso", "concepcion", "antofagasta", "calama", "rancagua", "temuco", "coquimbo", "iquique", "arica", "talca", "copiapo", "puerto montt", "osorno", "los angeles"];
  var NOMBRE_CIUDAD = { "la serena": "La Serena", santiago: "Santiago", valparaiso: "Valparaíso", concepcion: "Concepción", antofagasta: "Antofagasta", calama: "Calama", rancagua: "Rancagua", temuco: "Temuco", coquimbo: "Coquimbo", iquique: "Iquique", arica: "Arica", talca: "Talca", copiapo: "Copiapó", "puerto montt": "Puerto Montt", osorno: "Osorno", "los angeles": "Los Ángeles" };
  function preguntar(texto) {
    var t = norm(texto), ciudad = null, prof = null, falta = /falta|pendiente|incompleto|sin ciudad|sin dato/.test(t), min = null, m;
    CIUDADES.forEach(function (c) { if (t.indexOf(c) > -1 && (!ciudad || c.length > ciudad.length)) ciudad = c; });
    if (/segur|prevenc|riesgo/.test(t)) prof = "Seguridad"; else if (/quimic|laborat/.test(t)) prof = "Química"; else if (/electric/.test(t)) prof = "Electricidad";
    if ((m = t.match(/(\d+)\s*(anos|años)/))) min = parseInt(m[1], 10);
    if (!ciudad && !prof && !falta && min == null) return { ok: false, msg: "No pude entender la pregunta. Prueba con una ciudad, una profesión o años de experiencia, por ejemplo: «técnicos en seguridad que vivan en La Serena»." };
    var ids = [], posibles = [];
    CANDIDATOS.forEach(function (c) {
      if (c.estado === "vetado") return;
      if (prof && c.prof !== prof) return;
      if (min != null && aniosDe(c) < min) return;
      if (falta && faltantes(c).length === 0) return;
      if (ciudad) {
        if (c.ciudad == null) { posibles.push(c.id); return; }
        if (norm(c.ciudad) !== ciudad) return;
      }
      ids.push(c.id);
    });
    var partes = [];
    if (prof) partes.push(prof === "Seguridad" ? "de seguridad" : prof === "Química" ? "de química" : "de electricidad");
    if (ciudad) partes.push("en " + NOMBRE_CIUDAD[ciudad]);
    if (min != null) partes.push("con " + min + " años o más");
    if (falta) partes.push("con datos pendientes");
    var que = partes.length ? " " + partes.join(" ") : "";
    var msg = "Encontré " + (ids.length + posibles.length) + " candidato" + (ids.length + posibles.length === 1 ? "" : "s") + que + ".";
    if (posibles.length) msg += " " + ids.length + " coinciden y " + posibles.length + " podría" + (posibles.length === 1 ? "" : "n") + " coincidir porque no tiene" + (posibles.length === 1 ? "" : "n") + " ciudad registrada.";
    if (ids.length + posibles.length === 0) msg = "No encontré candidatos" + que + ". Prueba con menos condiciones.";
    return { ok: true, ids: ids, posibles: posibles, msg: msg, q: texto };
  }

  var ARCHIVOS = [];
  /* Estimación de lo que costaría leer el archivo. Un token es un trozo de texto (unas 4 letras).
     Texto y LinkedIn: cálculo real por largo. PDF y Word: rango típico tras extraer solo el texto.
     Imagen o escaneo: necesita lectura visual (OCR), que cuesta más. */
  var TOPE_TOKENS = 3000;
  function estimarTokens(a) {
    var ext = (a.n.split(".").pop() || "").toLowerCase();
    if (a.txt != null) return "Se enviaría solo el texto: ≈ " + Math.min(TOPE_TOKENS, Math.ceil(a.txt / 4)).toLocaleString("es-CL") + " tokens (tope " + TOPE_TOKENS.toLocaleString("es-CL") + ")";
    if (ext === "pdf" || ext === "doc" || ext === "docx") return "Texto extraído en tu equipo: ≈ 1.500 a 3.000 tokens, sin enviar el archivo";
    if (/^(png|jpe?g|webp|heic)$/.test(ext)) return "Imagen: se lee con visión (cuesta más); conviene subir el PDF original";
    return "Texto extraído en tu equipo, con tope de " + TOPE_TOKENS.toLocaleString("es-CL") + " tokens";
  }

    }).join("");
    var listos = ARCHIVOS.length && ARCHIVOS.every(function (a) { return a.p >= 100; });
    return '<div class="page"><div class="toolbar"><h1>Cargar currículos</h1></div>' +
      '<div class="drop" id="drop"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><b>Arrastra los currículos aquí</b><p>PDF, Word, imagen o texto. Puedes subir varios a la vez.</p>' +
      '<button class="btn primary" data-act="pick">' + ic("upload") + 'Elegir archivos</button><input type="file" id="fileIn" class="sr" multiple accept=".pdf,.doc,.docx,.txt,image/*" tabindex="-1"></div>' +
      '<div class="assistant-note note-cost" role="note">' + ic("spark") + '<span><b>Cómo se cuida el costo (versión real)</b><br>1) El texto del PDF o Word se lee en tu equipo; a Claude no se le envía el archivo, solo texto limpio. 2) Se corta a un máximo de unos 3.000 tokens por currículo. 3) Se usa Haiku, el modelo más económico. 4) Un currículo ya leído no se vuelve a procesar. En esta demo todo es simulado.</span></div>' +

  /* Progreso simulado. CONECTAR AL SERVIDOR: aquí se subiría cada archivo. */
  function agregarArchivos(nombres) {
    if (!nombres.length) return;
    nombres.forEach(function (it) {
      var a = { n: it.n, txt: it.txt, p: 0 }; ARCHIVOS.push(a);

      }, 260);
    });
    render(false);
  }

  document.addEventListener("change", function (e) {
    var id = e.target.id || "";
    if (id.indexOf("f-") === 0) { var k = id.slice(2); if (e.target.checked) { if (S.chips.indexOf(k) === -1) S.chips.push(k); } else { S.chips = S.chips.filter(function (x) { return x !== k; }); delete S.f.q[k]; if (S.f.m) delete S.f.m[k]; } }
    if (id === "c-correo") S.canales.correo = e.target.checked;
    if (id === "c-whatsapp") S.canales.whatsapp = e.target.checked;
    if (id === "c-linkedin") S.canales.linkedin = e.target.checked;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (document.getElementById("ov")) cerrarHoja(); else closeMenu(); }
    if (e.key === "Tab" && document.getElementById("ov")) {
      var sh = document.querySelector(".sheet"), els = Array.prototype.slice.call(sh.querySelectorAll("button:not([disabled]), textarea, input, select")); if (!els.length) return;
      var first = els[0], last = els[els.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* Tema claro/oscuro: respeta el del sistema hasta que la persona elige */
  function temaActual() { var t = document.documentElement.getAttribute("data-theme"); return t || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  function pintarTema() { document.getElementById("themeBtn").innerHTML = ic(temaActual() === "dark" ? "sun" : "moon"); }
  function cambiarTema() {
    var n = temaActual() === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n);
    try { localStorage.setItem("gladibu-tema", n); } catch (err) { /* sin almacenamiento: no pasa nada */ }
    pintarTema();
  }
  try { var g = localStorage.getItem("gladibu-tema"); if (g === "dark" || g === "light") document.documentElement.setAttribute("data-theme", g); } catch (err) { /* ignorar */ }
  window.matchMedia("(min-width: 1100px)").addEventListener("change", closeMenu);

  pintarTema();
  render(false);
})();

</script>
</body>
</html>
