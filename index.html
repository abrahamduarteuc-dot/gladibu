/* ---------- Tokens (modo claro por defecto) ---------- */
:root {
  --bg: #f1f4f6;
  --surface: #ffffff;
  --ink: #14202e;
  --soft: #5d6b7a;
  --line: #e1e7ec;
  --primary: #0b6e8a;
  --on-primary: #ffffff;
  --deep: #0e3a4b;
  --tint: #e1f1f5;
  --gold: #8a6200;
  --gold-line: #d9a521;
  --gold-bg: #fbf1d4;
  --green: #1d6a40;
  --green-line: #3aa36c;
  --green-bg: #e3f3e9;
  --red: #a8372f;
  --red-line: #d9776f;
  --red-bg: #fbe5e2;
  --hero-soft: #b9d7e0;
  --tile-fg: #ffffff;
  --focus: #0b6e8a;
  --shadow: 0 1px 2px rgba(20, 32, 46, .06), 0 10px 28px -16px rgba(20, 32, 46, .22);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --radius: 18px;
  --topbar-h: 60px;
  --sidebar-w: 264px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1620;
    --surface: #142230;
    --ink: #e7eef4;
    --soft: #9db0c0;
    --line: #243649;
    --primary: #4db8d6;
    --on-primary: #06222c;
    --deep: #0b2d3b;
    --tint: #123846;
    --gold: #e3b84a;
    --gold-line: #c99a2c;
    --gold-bg: #3a2f10;
    --green: #62c48f;
    --green-line: #3d9a6b;
    --green-bg: #123525;
    --red: #f08a82;
    --red-line: #c9625b;
    --red-bg: #3d1b19;
    --hero-soft: #9fc6d3;
    --tile-fg: #0b1118;
    --focus: #4db8d6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -16px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0c1620;
  --surface: #142230;
  --ink: #e7eef4;
  --soft: #9db0c0;
  --line: #243649;
  --primary: #4db8d6;
  --on-primary: #06222c;
  --deep: #0b2d3b;
  --tint: #123846;
  --gold: #e3b84a;
  --gold-line: #c99a2c;
  --gold-bg: #3a2f10;
  --green: #62c48f;
  --green-line: #3d9a6b;
  --green-bg: #123525;
  --red: #f08a82;
  --red-line: #c9625b;
  --red-bg: #3d1b19;
  --hero-soft: #9fc6d3;
  --tile-fg: #0b1118;
  --focus: #4db8d6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -16px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  caret-color: var(--primary);
  scrollbar-color: var(--line) transparent;
}
::selection { background: var(--tint); color: var(--ink); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.015em; line-height: 1.15; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--primary); text-underline-offset: 3px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 14px;
  font-weight: 700; font-size: 15px; white-space: nowrap;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  transition: transform 140ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, opacity 160ms ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.deep { background: var(--deep); border-color: var(--deep); color: #fff; }
.btn.danger { color: var(--red); border-color: var(--red-line); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--primary); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 14px; color: var(--ink);
  transition: transform 140ms var(--ease-out), background-color 160ms ease;
}
.icon-btn:active { transform: scale(0.95); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { border-color: var(--primary); }
  .btn.primary:hover { background: var(--deep); border-color: var(--deep); color: #fff; }
  .icon-btn:hover { background: var(--tint); }
}

/* ---------- Cinta DEMO y barra superior ---------- */
.ribbon {
  background: var(--ink); color: var(--bg); text-align: center;
  font-size: 13px; font-weight: 600; letter-spacing: .02em; padding: 7px 16px;
}
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; text-decoration: none; color: var(--ink); }
.brand svg { width: 34px; height: 34px; }
.brand b { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
.brand span { font-size: 14px; font-weight: 600; color: var(--soft); }
@media (max-width: 420px) { .brand span { display: none; } }

/* ---------- Estructura: menú lateral + contenido ---------- */
.shell { display: block; }
.sidebar {
  position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: min(86vw, 300px);
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-102%); transition: transform 320ms var(--ease-drawer);
  overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
}
.sidebar.open { transform: none; }
.scrim {
  position: fixed; inset: 0; z-index: 40; background: rgba(8, 20, 28, .5);
  opacity: 0; pointer-events: none; transition: opacity 240ms ease;
}
.scrim.show { opacity: 1; pointer-events: auto; }
.nav-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 14px;
  border-radius: 14px; font-weight: 600; text-align: left; color: var(--ink);
  transition: background-color 160ms ease, transform 140ms var(--ease-out);
}
.nav-item:active { transform: scale(0.98); }
.nav-item .count { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--soft); }
.nav-item[aria-current="page"] { background: var(--tint); color: var(--primary); }
.nav-item[aria-current="page"] .count { color: var(--primary); }
.nav-sep { height: 1px; background: var(--line); margin: 8px 6px; }
@media (hover: hover) and (pointer: fine) { .nav-item:hover { background: var(--tint); } }

.main { padding: 16px 16px 48px; min-width: 0; }
.page { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
.page.wide { max-width: none; }

@media (min-width: 1100px) {
  .shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .sidebar {
    position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); width: auto;
    transform: none; transition: none; background: transparent; border-right: 1px solid var(--line);
  }
  .nav-head { display: none; }
  .scrim { display: none; }
  body.nav-collapsed .shell { grid-template-columns: 0 minmax(0, 1fr); }
  body.nav-collapsed .sidebar { display: none; }
  .main { padding: 28px 32px 64px; }
}

/* ---------- Tarjetas ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.card h2 { font-size: 19px; font-weight: 800; }
.card .sub { color: var(--soft); font-size: 14px; margin-top: 4px; }

/* ---------- Inicio: banner ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 28px; background: var(--deep); color: #fff;
  padding: 24px 20px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px;
}
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .06); pointer-events: none; }
.hero::before { width: 280px; height: 280px; right: -90px; top: -120px; }
.hero::after { width: 180px; height: 180px; right: 90px; bottom: -110px; background: rgba(255, 255, 255, .04); }
.hero > * { position: relative; z-index: 1; }
.hero .total { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hero .total b { font-size: clamp(52px, 12vw, 76px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.hero .total span { font-size: 17px; font-weight: 600; color: var(--hero-soft); }
.bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, .12); gap: 3px; }
.bar i { display: block; min-width: 6px; transition: flex-grow 400ms var(--ease-out); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; font-size: 14px; color: var(--hero-soft); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ask { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.ask label { font-weight: 700; font-size: 15px; }
.ask-row { display: flex; gap: 8px; background: #fff; border-radius: 16px; padding: 6px; }
.ask-row input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 12px; min-height: 46px; color: #14202e; font-size: 16px; }
.ask-row input::placeholder { color: #5d6b7a; }
.ask-row input:focus-visible { outline: none; }
.ask-row:focus-within { outline: 3px solid #8fd3e6; outline-offset: 2px; }
.ask-row .btn { min-height: 46px; border-radius: 12px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest button {
  min-height: 40px; padding: 0 14px; border-radius: 99px; font-size: 14px; font-weight: 600; color: #fff; text-align: left;
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22);
  transition: background-color 160ms ease, transform 140ms var(--ease-out);
}
.suggest button:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .suggest button:hover { background: rgba(255, 255, 255, .2); } }
@media (min-width: 720px) { .hero { padding: 32px 32px 28px; } }

/* ---------- Inicio: tarjetas que filtran ---------- */
.kgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 720px) { .kgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
.kcard {
  --c: var(--primary); text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-top: 5px solid var(--c); border-radius: var(--radius); padding: 14px 16px 16px; min-height: 112px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 8px; box-shadow: var(--shadow);
  transition: transform 160ms var(--ease-out), border-color 160ms ease;
}
.kcard:active { transform: scale(0.98); }
.kcard b { font-size: 44px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.kcard span { font-size: 15px; font-weight: 700; }
.kcard small { display: block; font-size: 13px; color: var(--soft); font-weight: 500; margin-top: 2px; }
@media (hover: hover) and (pointer: fine) { .kcard:hover { border-color: var(--c); transform: translateY(-2px); } }

/* ---------- Filtros rápidos (chips) ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; min-height: 44px; border: 1.5px solid var(--line); border-radius: 99px;
  background: var(--surface); overflow: hidden; transition: border-color 160ms ease;
}
.chip.on { border-color: var(--primary); background: var(--tint); }
.chip button.l { min-height: 44px; padding: 0 6px 0 16px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.chip button.l em { font-style: normal; font-weight: 600; color: var(--primary); }
.chip button.x { width: 38px; min-height: 44px; display: grid; place-items: center; color: var(--soft); }
.chip button.x svg { width: 16px; height: 16px; }
.chip.add { border-style: dashed; color: var(--primary); }
.chip.add button.l { padding: 0 16px 0 12px; color: var(--primary); }
@media (hover: hover) and (pointer: fine) { .chip:hover { border-color: var(--primary); } .chip button.x:hover { color: var(--red); } }

/* ---------- Semáforo y etiquetas ---------- */
.sem { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 99px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.sem::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.sem.g { background: var(--green-bg); color: var(--green); }
.sem.y { background: var(--gold-bg); color: var(--gold); }
.sem.r { background: var(--red-bg); color: var(--red); }
.sem.n { background: var(--line); color: var(--soft); }
.tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 700; background: var(--line); color: var(--soft); }
.tag.rev { background: var(--tint); color: var(--primary); }
.tag.con { background: var(--gold-bg); color: var(--gold); }
.tag.gua { background: var(--green-bg); color: var(--green); }
.tag.vet { background: var(--red-bg); color: var(--red); }
.tag.dat { background: var(--line); color: var(--ink); }

/* ---------- Resultados ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar h1 { font-size: 26px; font-weight: 800; }
.toolbar .count { color: var(--soft); font-weight: 600; }
.active-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.atag { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 4px 0 12px; border-radius: 99px; background: var(--tint); color: var(--primary); font-size: 14px; font-weight: 700; }
.atag button { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
.atag svg { width: 15px; height: 15px; }
.assistant-note { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--tint); color: var(--ink); font-weight: 600; }
.assistant-note svg { color: var(--primary); margin-top: 2px; }
.list { display: grid; gap: 10px; }
.row {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 12px 14px; min-height: 76px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  transition: transform 160ms var(--ease-out), border-color 160ms ease, background-color 160ms ease;
}
.row:active { transform: scale(0.99); }
.row[aria-current="true"] { border-color: var(--primary); background: var(--tint); }
.avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--primary); font-weight: 800; font-size: 16px; letter-spacing: .02em; }
.row .nm { font-weight: 700; font-size: 16px; line-height: 1.25; }
.row .rl { color: var(--soft); font-size: 14px; }
.row .meta { color: var(--soft); font-size: 13.5px; margin-top: 1px; }
.row .end { display: grid; gap: 6px; justify-items: end; }
@media (max-width: 480px) { .row { grid-template-columns: 44px minmax(0, 1fr); } .row .end { grid-column: 2; display: flex; justify-content: flex-start; flex-wrap: wrap; gap: 6px; } .avatar { width: 44px; height: 44px; } }
@media (hover: hover) and (pointer: fine) { .row:hover { border-color: var(--primary); } }
.empty { text-align: center; padding: 40px 20px; color: var(--soft); }
.empty b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 6px; }

/* ---------- Ficha + currículo ---------- */
.detail { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.detail .listpane { display: none; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 14px; }
.tabs button { min-height: 44px; border-radius: 11px; font-weight: 700; color: var(--soft); transition: background-color 160ms ease, color 160ms ease; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.detail[data-tab="ficha"] .cvpane { display: none; }
.detail[data-tab="cv"] .fichapane { display: none; }
.fichapane { display: grid; gap: 16px; align-content: start; min-width: 0; }
.cvpane { min-width: 0; }
.head { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.head .avatar { width: 64px; height: 64px; font-size: 22px; }
.head h1 { font-size: 24px; font-weight: 800; }
.head p { color: var(--soft); }
.contact { display: grid; gap: 4px; margin-top: 14px; }
.crow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 48px; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; }
.crow svg { color: var(--soft); }
.crow span { overflow-wrap: anywhere; font-weight: 600; font-size: 15px; }
.crow .miss { color: var(--red); font-weight: 700; }
.copy { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--primary); }
.copy[data-done="1"] { color: var(--green); }
.crits { display: grid; gap: 0; margin-top: 12px; }
.crit { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.crit:first-child { border-top: 0; }
.crit b { display: block; font-size: 15px; }
.crit p { color: var(--soft); font-size: 14px; }
.note { font-size: 14px; font-weight: 600; color: var(--soft); background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.timeline { display: grid; gap: 0; margin-top: 12px; }
.job { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 14px; padding-bottom: 16px; position: relative; }
.job::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.job:last-child { padding-bottom: 0; }
.job:last-child::before { display: none; }
.job i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--primary); background: var(--surface); margin-top: 4px; }
.job b { display: block; font-size: 15px; }
.job span { display: block; color: var(--soft); font-size: 14px; }
.actions .btn { padding: 0 10px; line-height: 1.2; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.alert { display: grid; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--gold-bg); color: var(--ink); border: 1px solid var(--gold-line); }
.alert b { color: var(--gold); }
.veto-box { padding: 14px 16px; border-radius: 16px; background: var(--red-bg); color: var(--ink); border: 1px solid var(--red-line); }
.veto-box b { color: var(--red); }
.confirm { display: grid; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--red-bg); border: 1px solid var(--red-line); grid-column: 1 / -1; }
.confirm .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.paper {
  background: #ffffff; color: #1a2430; border-radius: 6px; padding: 28px 24px 32px; font-size: 13.5px; line-height: 1.55;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 18px 40px -20px rgba(0, 0, 0, .35); min-height: 560px;
}
.paper h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.paper .role { color: #3b4a5a; font-weight: 600; font-size: 15px; margin-top: 2px; }
.paper .ct { color: #3b4a5a; font-size: 12.5px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.paper h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #0b6e8a; border-bottom: 1px solid #d8e0e6; padding-bottom: 4px; margin: 20px 0 8px; }
.paper .it { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
.paper .it span { font-weight: 500; color: #3b4a5a; white-space: nowrap; }
.paper p.d { color: #3b4a5a; margin-bottom: 8px; }
.paper ul { margin: 0; padding-left: 18px; }
@media (min-width: 720px) { .paper { padding: 44px 48px 48px; font-size: 14px; } }

@media (min-width: 1100px) {
  .detail { grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .tabs { display: none; }
  .detail[data-tab="ficha"] .cvpane, .detail[data-tab="cv"] .fichapane { display: grid; }
  .cvpane { position: sticky; top: calc(var(--topbar-h) + 20px); max-height: calc(100vh - var(--topbar-h) - 40px); overflow-y: auto; border-radius: 6px; }
}
@media (min-width: 1560px) {
  .detail { grid-template-columns: 320px minmax(340px, 420px) minmax(0, 1fr); }
  .detail .listpane { display: block; position: sticky; top: calc(var(--topbar-h) + 20px); max-height: calc(100vh - var(--topbar-h) - 40px); overflow-y: auto; }
  .listpane .list { gap: 8px; }
  .listpane .row { grid-template-columns: 40px minmax(0, 1fr); padding: 10px 12px; min-height: 64px; }
  .listpane .row .end { display: none; }
  .listpane .avatar { width: 40px; height: 40px; font-size: 14px; }
}

/* ---------- Cargar currículos ---------- */
.drop {
  display: grid; justify-items: center; gap: 10px; text-align: center; padding: 36px 20px;
  border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface); transition: border-color 160ms ease, background-color 160ms ease;
}
.drop.over { border-color: var(--primary); background: var(--tint); }
.drop svg { width: 36px; height: 36px; color: var(--primary); }
.drop b { font-size: 18px; }
.drop p { color: var(--soft); font-size: 14px; }
.files { display: grid; gap: 10px; }
.file { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.file .top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 14px; }
.file .top span:first-child { overflow-wrap: anywhere; }
.prog { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--primary); transition: width 220ms linear; }
.file[data-done="1"] .prog i { background: var(--green-line); }
textarea.field, input.field, select.field {
  width: 100%; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px; min-height: 48px; font-size: 16px;
}
textarea.field { min-height: 120px; resize: vertical; line-height: 1.5; }
.field:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

/* ---------- Configuración ---------- */
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.acc + .acc { margin-top: 12px; }
.acc summary { list-style: none; min-height: 60px; padding: 0 20px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 17px; cursor: pointer; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .chev { margin-left: auto; transition: transform 200ms var(--ease-out); color: var(--soft); }
.acc[open] summary .chev { transform: rotate(180deg); }
.acc .body { padding: 4px 20px 20px; display: grid; gap: 14px; }
.lab { display: grid; gap: 6px; font-weight: 700; font-size: 14px; }
.lab small { font-weight: 500; color: var(--soft); font-size: 13.5px; }
.sw { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; min-height: 52px; }
.sw b { display: block; font-size: 15px; }
.sw small { color: var(--soft); font-size: 13.5px; }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw .track { width: 52px; height: 32px; border-radius: 99px; background: var(--line); position: relative; transition: background-color 180ms ease; flex: none; }
.sw .track::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform 200ms var(--ease-out); }
.sw input:checked + .track { background: var(--primary); }
.sw input:checked + .track::after { transform: translateX(20px); }
.sw input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
.sw.locked { opacity: .65; }
.sw.locked .track { background: var(--line); }
.lock { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--soft); }

/* ---------- Hojas (modales) y avisos ---------- */

  function preguntar(texto) {

  var ARCHIVOS = [], ARC_ID = 0;

  function nombreDeArchivo(n) {

    if (!base || base.split(" ").length < 2) return null;
    return base.split(" ").slice(0, 4).map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }).join(" ");
  }
  function clasificarArchivo(a) {
    var h = hashS(a.n); a.dudas = [];

    if (!nom) a.dudas.push({ id: "nom", q: "No encontré el nombre completo en el archivo. ¿Cómo se llama la persona?", campo: true, ph: "Nombre y apellidos" });

  /* ======================================================================

  /* Rueda: el candidato elegido va al frente; los demás quedan detrás, repartidos en un arco que gira. */
  function posicionarRueda() {
    var w = document.getElementById("wheel"); if (!w) return;
    var cards = w.querySelectorAll(".wc"), n = cards.length, a = S.cmp.active, narrow = w.clientWidth < 600;
    var R = narrow ? 250 : 340, step = narrow ? 18 : 15;
    Array.prototype.forEach.call(cards, function (el, i) {
      var d = ((i - a) % n + n) % n; if (d > n / 2) d -= n;
      var ad = Math.abs(d), th = d * step * Math.PI / 180;
      el.style.transform = "translate(-50%,0) translate(" + (R * Math.sin(th)).toFixed(1) + "px," + (R * (1 - Math.cos(th))).toFixed(1) + "px) rotate(" + (d * step * 0.55).toFixed(1) + "deg) scale(" + (1 - Math.min(ad, 3) * 0.09).toFixed(3) + ")";
      el.style.zIndex = String(30 - ad * 3);
      el.style.opacity = ad > 2 ? "0" : String(1 - ad * 0.3);
      el.style.pointerEvents = ad > 2 ? "none" : "auto";
      el.setAttribute("aria-current", d === 0 ? "true" : "false");
      el.tabIndex = d === 0 ? 0 : -1;
    });

  }

        else if (b.dataset.act === "veto-ok") {
          var det = sh.querySelector("#vetoTxt").value.trim();
          if (mot === 4 && det.length < 10) { aviso("Describe el motivo con al menos 10 letras."); sh.querySelector("#vetoTxt").focus(); e.stopPropagation(); return; }
          c.estado = "vetado"; c.vetoMotivo = (mot === 4 ? det : MOTIVOS[mot] + (det ? ". " + det : "")); c.vetoFecha = new Date().toISOString().slice(0, 10);
          cerrarHoja(); render(false); aviso(c.nombre.split(" ")[0] + " quedó vetado. El motivo quedó registrado."); e.stopPropagation();
        }
      });
    });
  }

  /* ======================================================================
     5. EVENTOS
     ====================================================================== */
  function closeMenu() { /* v2: el menú es la barra inferior, no hay panel que cerrar */ }
  function esDesktop() { return window.matchMedia("(min-width: 1100px)").matches; }

  function bindDrop(d) {
    ["dragenter", "dragover"].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.remove("over"); }); });
    d.addEventListener("drop", function (e) { agregarArchivos(Array.prototype.slice.call(e.dataTransfer.files).map(function (f) { return { n: f.name, txt: /\.txt$/i.test(f.name) ? f.size : null }; })); });
    document.getElementById("fileIn").addEventListener("change", function (e) { agregarArchivos(Array.prototype.slice.call(e.target.files).map(function (f) { return { n: f.name, txt: /\.txt$/i.test(f.name) ? f.size : null }; })); e.target.value = ""; });
  }
  /* Progreso simulado. CONECTAR AL SERVIDOR: aquí se subiría cada archivo. */
  function agregarArchivos(items) {
    if (!items.length) return;
    items.forEach(function (it) {
      var a = { id: "a" + (++ARC_ID), n: it.n, txt: it.txt, p: 0, dudas: [] }; clasificarArchivo(a); ARCHIVOS.push(a);
      var t = setInterval(function () {
        a.p = Math.min(100, a.p + 8 + Math.random() * 14);
        if (a.p >= 100) clearInterval(t);
        var ae = document.activeElement, escribiendo = ae && ae.tagName === "INPUT" && ae.form && ae.form.dataset.form === "dq";
        if (S.view === "upload" && !escribiendo) { var y = window.scrollY; render(false); window.scrollTo(0, y); }
      }, 260);
    });
    render(false);
  }
  function ofertaDesdeArchivo(nombre, fileObj) {
    var ej = EJEMPLOS[hashS(nombre) % EJEMPLOS.length], th = null;
    try { if (fileObj && fileObj.type && fileObj.type.indexOf("image/") === 0) th = URL.createObjectURL(fileObj); } catch (err) { th = null; }
    leerOferta({ titulo: ej.titulo, reqs: ej.reqs, texto: ej.texto || null, thumb: th, nota: "Demo: la oferta «" + nombre + "» no se lee de verdad; se muestran requisitos de ejemplo. En la versión real Claude lee la imagen y la guarda como respaldo del proceso." });
  }

  function copiar(txt, btn) {
    function ok() { btn.dataset.done = "1"; btn.innerHTML = ic("check"); setTimeout(function () { btn.dataset.done = ""; btn.innerHTML = ic("copy"); }, 1500); }
    try { navigator.clipboard.writeText(txt).then(ok, function () { aviso("No se pudo copiar. Selecciona el texto y cópialo."); }); }
    catch (err) { aviso("No se pudo copiar. Selecciona el texto y cópialo."); }
  }

  function candidatoSel() { return CANDIDATOS.filter(function (c) { return c.id === S.sel; })[0]; }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act, v = b.dataset.v, c;
    if (a === "ov-close") { if (e.target.id === "ov") cerrarHoja(); return; }
    if (b.closest(".sheet")) { if (a === "sheet-close") cerrarHoja(); else if (a === "chip-new") { S.chips.push(v); cerrarHoja(); render(false); } return; }
    switch (a) {
      case "vista": S.vista = v; render(false); break;
      case "rowmenu": hojaFila(CANDIDATOS.filter(function (x) { return x.id === v; })[0]); break;
      case "theme": cambiarTema(); break;
      case "home": e.preventDefault(); S.f = { estado: null, falta: false, q: {}, m: {}, ask: null }; ir("home"); break;
      case "go-estado": S.f = { estado: v || null, falta: false, q: {}, m: {}, ask: null }; ir("results"); break;
      case "go-falta": S.f = { estado: null, falta: true, q: {}, m: {}, ask: null }; ir("results"); break;
      case "go-cargar": ir("upload"); break;
      case "go-config": ir("settings"); break;
      case "suggest": var inp = document.getElementById("askIn"); inp.value = v; inp.focus(); break;
      case "chip": hojaFiltro(v); break;
      case "chip-del": S.chips = S.chips.filter(function (k) { return k !== v; }); delete S.f.q[v]; if (S.f.m) delete S.f.m[v]; render(false); break;
      case "chip-add": hojaAgregar(); break;
      case "rm-estado": S.f.estado = null; render(false); break;
      case "rm-falta": S.f.falta = false; render(false); break;
      case "rm-q": delete S.f.q[v]; if (S.f.m) delete S.f.m[v]; render(false); break;
      case "rm-ask": S.f.ask = null; render(false); break;
      case "open": S.sel = v; S.tab = "ficha"; S.confirmDel = false; S.from = S.view; ir("detail"); break;
      case "back": ir(S.from === "compare" ? "compare" : S.from === "home" ? "home" : "results"); break;
      case "tab": S.tab = v; render(false); break;
      case "copy": copiar(v, b); break;
      case "guardar": c = candidatoSel(); c.estado = c.estado === "guardado" ? "revisar" : "guardado"; render(false); aviso(c.estado === "guardado" ? "Guardado para después." : "Quitado de guardados."); break;
      case "contactar": hojaMensaje(candidatoSel(), v); break;
      case "pedir": hojaMensaje(candidatoSel()); break;
      case "vetar": hojaVeto(candidatoSel()); break;
      case "unveto": c = candidatoSel(); c.estado = "revisar"; c.vetoMotivo = null; render(false); aviso("Se quitó el veto. Volvió a Por revisar."); break;
      case "del-ask": S.confirmDel = true; render(false); var ds = document.querySelector('[data-act="del-cancel"]'); if (ds) ds.focus(); break;
      case "del-cancel": S.confirmDel = false; render(false); break;
      case "del-ok": c = candidatoSel(); CANDIDATOS.splice(CANDIDATOS.indexOf(c), 1); S.sel = null; S.confirmDel = false; ir("results"); aviso(c.nombre + " fue eliminado."); break;
      case "go-compare": ir("compare"); break;
      case "hist-open": drawer(true); break;
      case "hist-close": drawer(false); break;
      case "hist-open-p": var hp = S.cmp.procs.filter(function (x) { return x.id === v; })[0]; drawer(false); if (hp) hojaProceso(hp); break;
      case "hist-new": if (S.drawer) drawer(false); hojaNuevo(); break;
      case "rec-add": var pa = procActual(); if (pa && !pa.cerrado) hojaAgregarCand(pa); break;
      case "proc-log": var pl = procActual(); if (pl) hojaRegistro(pl); break;
      case "off-pick": document.getElementById("offIn").click(); break;
      case "off-example": var ex = EJEMPLOS[parseInt(v, 10)]; leerOferta({ titulo: ex.titulo, reqs: ex.reqs, texto: ex.texto || null, nota: "" }); break;
      case "req-toggle": var p1 = procActual(); if (!p1 || p1.cerrado) break; p1.reqs.forEach(function (r) { if (r.id === v) r.m = r.m === EXC ? DES : EXC; }); cambioReqs(p1); break;
      case "req-del": var p2 = procActual(); if (!p2 || p2.cerrado) break; p2.reqs = p2.reqs.filter(function (r) { return r.id !== v; }); cambioReqs(p2); break;
      case "proc-cerrar": var p3 = procActual(); if (p3 && !p3.cerrado) hojaCerrar(p3); break;
      case "proc-reabrir": var p6 = procActual(); if (p6 && p6.cerrado) hojaReabrir(p6); break;
      case "off-ver": e.preventDefault(); var p7 = procActual(); if (p7) hojaOferta(p7); break;
      case "to-rec": var p8 = procActual(); if (!p8 || p8.cerrado) break; if (!p8.seg[v]) { p8.seg[v] = { e: "pend" }; logP(p8, candPorId(v).nombre + ": enviado a Reclutador."); guardarProcs(); posicionarRueda(); aviso("Enviado a Reclutador: quedó en Pendientes."); } break;
      case "rec-est": S.rec.est = v; render(false); break;
      case "rec-dia": S.rec.dia = v; render(false); break;
      case "seg-av": var p9 = procActual(); if (p9) avanzarSeg(p9, v); break;
      case "seg-reag": var p10 = procActual(); if (p10 && !p10.cerrado) hojaAgendar(p10, v); break;
      case "seg-react": var p11 = procActual(); if (p11) reactivarSeg(p11, v); break;
      case "seg-desc": var p12 = procActual(); if (p12 && !p12.cerrado) hojaSalida(p12, v, "desc"); break;
      case "seg-decl": var p13 = procActual(); if (p13 && !p13.cerrado) hojaSalida(p13, v, "decl"); break;
      case "hero-toggle": S.heroC = !S.heroC; render(false); break;
      case "letra": var le = document.getElementById("L-" + v); if (le) le.scrollIntoView({ behavior: "smooth", block: "start" }); break;
      case "dq-opt": var dp = v.split("|"), da = ARCHIVOS.filter(function (x) { return x.id === dp[0]; })[0]; if (!da) break;
        var dd = da.dudas.filter(function (x) { return x.id === dp[1]; })[0], di = parseInt(dp[2], 10); if (!dd) break; dd.r = dd.opts[di];
        if (dd.id === "of" && di === 0) { S.view = "compare"; ofertaDesdeArchivo(da.n, null); break; }
        if (dd.id === "dup") dd.r = di === 0 ? "Listo: actualicé la ficha que ya existía." : "Listo: la guardé como una persona nueva.";
        if (dd.id === "of") dd.r = "Archivo ignorado.";
        render(false); break;
      case "dq-skip": var sp = v.split("|"), sa = ARCHIVOS.filter(function (x) { return x.id === sp[0]; })[0]; if (!sa) break;
        var sd = sa.dudas.filter(function (x) { return x.id === sp[1]; })[0]; if (sd) sd.r = "Quedó sin dato: aparecerá en «Falta dato»."; render(false); break;
      case "proc-reeval": var p4 = procActual(); if (!p4) break; var q4 = nuevoProceso({ titulo: p4.titulo.replace(/ \(re-evaluado\)$/, "") + " (re-evaluado)", reqs: p4.reqs, texto: p4.texto }); S.cmp.procs.unshift(q4); S.cmp.cur = q4.id; S.cmp.active = 0; S.cmp.offOpen = false; guardarProcs(); render(false); aviso("Proceso nuevo con los CV de hoy. El anterior queda intacto."); break;
      case "proc-csv": var p5 = procActual(); if (p5) descargarCsv(p5); break;
      case "wheel-prev": girar(-1); break;
      case "wheel-next": girar(1); break;
      case "wheel-card": if (arrastro) { arrastro = false; break; } var wi = parseInt(v, 10); if (wi === S.cmp.active) { S.sel = S.cmp._top[wi].cid; S.tab = "ficha"; S.confirmDel = false; S.from = "compare"; ir("detail"); } else { S.cmp.active = wi; posicionarRueda(); } break;
      case "cmp-pedir": var cp = CANDIDATOS.filter(function (x) { return x.id === v; })[0]; if (cp) hojaMensaje(cp); break;
      case "pick": document.getElementById("fileIn").click(); break;
      case "save-demo": aviso("Demo: la clave no se guarda ni se envía a nadie."); break;
    }
  });

  document.addEventListener("submit", function (e) {
    var f = e.target.dataset.form; if (!f) return; e.preventDefault();
    if (f === "q") return;
    if (f === "newrec") { var nt = (document.getElementById("nrT").value || "").trim(); if (nt.length < 3) { aviso("Ponle un nombre al proceso."); return; } crearProcRec(nt); return; }
    if (f === "dq") {
      var kv = e.target.dataset.v.split("|"), xa = ARCHIVOS.filter(function (x) { return x.id === kv[0]; })[0], xd = xa && xa.dudas.filter(function (x) { return x.id === kv[1]; })[0];
      var val = (e.target.querySelector("input").value || "").trim(); if (!val) { aviso("Escribe la respuesta o toca «Dejar sin dato»."); return; }
      if (xd) { xd.r = "Anotado: " + val + "."; if (xd.id === "nom" && xa.res) xa.res.nombre = val; if (xd.id === "ciu" && xa.res) xa.res.ciudad = val; }
      render(false); return;
    }
    if (f === "offer" || f === "refine") { enviarOferta(f); return; }
    if (f === "ask") {
      var txt = document.getElementById("askIn").value.trim();
      if (!txt) { aviso("Escribe una pregunta o toca una sugerencia."); return; }
      var r = preguntar(txt);
      if (!r.ok) { aviso(r.msg); return; }
      S.f = { estado: null, falta: false, q: {}, ask: r }; ir("results");
    } else if (f === "linkedin") {
      var t = document.getElementById("liText").value.trim();
      if (!t) { aviso("Pega primero el texto del perfil."); return; }
      agregarArchivos([{ n: "Perfil de LinkedIn (texto pegado)", txt: t.length }]);
    }
  });
  document.addEventListener("change", function (e) {
    var id = e.target.id || "";
    if (id === "offIn") {
      var fl = e.target.files[0];
      if (fl) ofertaDesdeArchivo(fl.name, fl);
      e.target.value = ""; return;
    }
    if (id.indexOf("f-") === 0) { var k = id.slice(2); if (e.target.checked) { if (S.chips.indexOf(k) === -1) S.chips.push(k); } else { S.chips = S.chips.filter(function (x) { return x !== k; }); delete S.f.q[k]; if (S.f.m) delete S.f.m[k]; } }
    if (id === "c-correo") S.canales.correo = e.target.checked;
    if (id === "c-whatsapp") S.canales.whatsapp = e.target.checked;
    if (id === "c-linkedin") S.canales.linkedin = e.target.checked;
  });
  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "qIn") { S.busca = e.target.value; refrescarLista(); }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && document.activeElement && document.activeElement.closest && document.activeElement.closest("#wheel")) { girar(e.key === "ArrowRight" ? 1 : -1); e.preventDefault(); return; }
    if (e.key === "Escape") { if (document.getElementById("ov")) cerrarHoja(); else if (S.drawer) drawer(false); else closeMenu(); }
    if (e.key === "Tab" && document.getElementById("ov")) {
      var sh = document.querySelector(".sheet"), els = Array.prototype.slice.call(sh.querySelectorAll("button:not([disabled]), textarea, input, select")); if (!els.length) return;
      var first = els[0], last = els[els.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* Rueda: deslizar con el dedo o el mouse gira; un toque en la tarjeta de atrás la trae al frente */
  var ptr = null, arrastro = false;
  document.addEventListener("pointerdown", function (e) { arrastro = false; ptr = (e.target.closest && e.target.closest("#wheel")) ? { x: e.clientX } : null; });
  document.addEventListener("pointerup", function (e) { if (!ptr) return; var dx = e.clientX - ptr.x; ptr = null; if (Math.abs(dx) > 10) arrastro = true; if (dx < -40) girar(1); else if (dx > 40) girar(-1); });
  document.addEventListener("pointercancel", function () { ptr = null; });
  document.addEventListener("toggle", function (e) { if (e.target && e.target.classList && e.target.classList.contains("offcard")) S.cmp.offOpen = e.target.open; }, true);
  window.addEventListener("resize", function () { if (S.view === "compare") posicionarRueda(); });

  /* Tema claro/oscuro: respeta el del sistema hasta que la persona elige */
  function temaActual() { var t = document.documentElement.getAttribute("data-theme"); return t || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  function pintarTema() { document.getElementById("themeBtn").innerHTML = ic(temaActual() === "dark" ? "sun" : "moon"); }
  function cambiarTema() {
    var n = temaActual() === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n);
    try { localStorage.setItem("gladibu-tema", n); } catch (err) { /* sin almacenamiento: no pasa nada */ }
    pintarTema();
  }
  try { var g = localStorage.getItem("gladibu-tema"); if (g === "dark" || g === "light") document.documentElement.setAttribute("data-theme", g); } catch (err) { /* ignorar */ }
  window.matchMedia("(min-width: 1100px)").addEventListener("change", closeMenu);

  cargarProcs();
  pintarTema();
  render(false);
})();

</script>
</body>
